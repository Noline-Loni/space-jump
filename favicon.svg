<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" rx="2" fill="#2b2b2b"/>
  <g transform="translate(1 1)">
    <!-- Koerper -->
    <rect x="0" y="0" width="14" height="10" fill="#e0a060"/>
    <rect x="0" y="9" width="14" height="1" fill="#d08a48"/>
    <rect x="0" y="0" width="1" height="10" fill="#d08a48"/>
    <rect x="13" y="0" width="1" height="10" fill="#d08a48"/>
    <rect x="1" y="0" width="12" height="1" fill="#e8b478"/>
    <!-- Augen -->
    <rect x="4" y="3" width="2" height="2" fill="#2b2b2b"/>
    <rect x="9" y="3" width="2" height="2" fill="#2b2b2b"/>
    <rect x="4" y="3" width="1" height="1" fill="#fff"/>
    <rect x="9" y="3" width="1" height="1" fill="#fff"/>
    <!-- Beine -->
    <rect x="2" y="10" width="3" height="4" fill="#e0a060"/>
    <rect x="9" y="10" width="3" height="4" fill="#e0a060"/>
    <rect x="2" y="13" width="3" height="1" fill="#d08a48"/>
    <rect x="9" y="13" width="3" height="1" fill="#d08a48"/>
